plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '1.0.0'
group = 'dev.fakeplayeraddon.test'
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.7+26.3'
    implementation files(providers.gradleProperty('chunkloaderJar').getOrElse('../../libs/fakeplayerchunkloader26.3-fabric-2.1.0.jar'))
    implementation files(providers.gradleProperty('addonJar').getOrElse('../../build/libs/fakeplayer-chunkloader-addon-26.3-1.1.1.jar'))
}
loom {
    enableModProvidedJavadoc = false
    runs {
        server {
            server()
            runDir 'run'
            programArgs '--nogui'
            vmArg '-Djava.awt.headless=true'
            if (providers.gradleProperty('restartCheck').isPresent()) {
                vmArg '-Dfakeplayeraddon.test.restart=true'
            }
        }
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
