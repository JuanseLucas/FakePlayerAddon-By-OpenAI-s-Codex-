plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'fakeplayer-chunkloader-addon-26.3' }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom { enableModProvidedJavadoc = false }

def upstreamJar = file(providers.gradleProperty('chunkloaderJar').getOrElse(
        'libs/fakeplayerchunkloader26.3-fabric-2.1.0.jar'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files(upstreamJar)
    runtimeOnly files(upstreamJar)
    testImplementation files(upstreamJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    doFirst {
        if (!upstreamJar.isFile()) {
            throw new GradleException('Provide the original Fakeplayer Chunkloader 2.1.0 jar in libs/ or with -PchunkloaderJar=/path/to/original.jar')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named('jar') {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('verifyMobTickingStore') {
    dependsOn tasks.named('test')
}
